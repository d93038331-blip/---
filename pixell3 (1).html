body{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:12px 0 24px}
.toy{position:relative;width:min(92vw,340px);margin-top:112px}
.chain{position:absolute;left:0;right:0;top:-104px;height:70px}
.bead{position:absolute;width:13px;height:13px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff,#9aa0a6 55%,#5f656b)}
.ring{position:absolute;left:50%;top:-44px;width:20px;height:28px;margin-left:-10px;border:4px solid #9aa0a6;border-radius:50%;z-index:2}
.tab{position:absolute;left:50%;top:-34px;width:24%;height:50px;margin-left:-12%;background:#f2b8cf;border:3px solid #d98aac;border-radius:22px 22px 0 0;z-index:0}
.egg{position:relative;z-index:1;width:100%;aspect-ratio:.82;background:#f4bdd2;border:3px solid #d98aac;border-radius:50% 50% 50% 50%/60% 60% 40% 40%;overflow:hidden;
 box-shadow:inset -8px -10px 0 rgba(217,138,172,.55),inset 6px 6px 0 rgba(255,255,255,.35),0 10px 0 #b8688c,0 16px 24px rgba(0,0,0,.3)}
.egg::after{content:"";position:absolute;left:0;right:0;top:61%;height:2px;background:rgba(150,60,100,.25)}
.sp{position:absolute;width:24px;height:7px;border-radius:4px}
.logo{position:absolute;top:10%;left:0;right:0;text-align:center;font-family:'Lilita One',Impact,'Arial Black',sans-serif;font-size:clamp(28px,9vw,36px);color:#a8133f;letter-spacing:1px;z-index:2;text-shadow:0 2px 0 rgba(255,255,255,.4)}
.logo span{display:inline-block}
.burstw{position:absolute;left:13%;top:21%;width:74%;aspect-ratio:1;z-index:2;filter:drop-shadow(0 3px 0 #cfa94a)}
.burst{position:absolute;inset:0;background:#f8e58f}
.screen{position:absolute;inset:11%;background:#f6ecab;border:3px solid #3d3a2a;border-radius:5px;overflow:hidden;display:flex;flex-direction:column;box-shadow:inset 0 0 10px rgba(0,0,0,.25)}
.screen::after{content:"";position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(0,0,0,.05) 0 1px,transparent 1px 3px)}
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:3px;height:21%;padding:3px}
.tile{border:none;padding:0;border-radius:45% 45% 38% 38%;background:#bfe3dc;display:flex;align-items:center;justify-content:center;font-size:clamp(14px,4.6vw,19px);cursor:pointer;-webkit-tap-highlight-color:transparent}
.tile:nth-child(even){background:#f6cfc9}
.px{fill:currentColor;display:block}
.tile{color:#2b2a22}.tile .px{width:58%;height:58%}
.tile.sel{background:#2b2a22;box-shadow:0 0 0 2px #2b2a22;color:#f6ecab}
.m{color:#2b2a22}.m .px{width:15px;height:13px;flex:none}
.tip-box .px{display:inline-block;width:11px;height:14px;vertical-align:-2px;margin-right:5px;color:#e8a317}
#pet{display:block;width:100%;flex:1;min-height:0;image-rendering:pixelated;image-rendering:crisp-edges}
.meters{height:19%;padding:3px 6px;display:flex;flex-direction:column;justify-content:center;gap:3px}
.m{display:flex;align-items:center;gap:5px;font-size:11px}
.seg{display:flex;gap:2px;flex:1}.seg i{flex:1;height:7px;background:#2b2a22;opacity:.17}.seg i.on{opacity:1}
.b{position:absolute;z-index:3;width:12%;aspect-ratio:1;border:none;border-radius:50%;font:bold 9px 'Courier New',monospace;color:rgba(255,220,190,.8);
 background:radial-gradient(circle at 35% 30%,#c98258,#8b4a2b 60%,#6e3a20);box-shadow:0 4px 0 #5a2e19,0 6px 6px rgba(0,0,0,.3);-webkit-tap-highlight-color:transparent}
.b:active{transform:translateY(3px);box-shadow:0 1px 0 #5a2e19}
.b:disabled{opacity:.55}
#bA{left:24%;top:85%}#bB{left:44%;top:88.5%}#bC{left:64%;top:85%}
.cap{width:min(92vw,340px);margin-top:26px;padding:10px 12px;border-radius:12px;background:var(--bg);color:var(--tx);font-size:12px;line-height:1.45;font-weight:bold;min-height:84px}
.cap #status-text{text-transform:uppercase}
#exercise-ui{display:none;text-align:center}
#instruction-text{margin:0 0 4px;text-transform:uppercase;white-space:pre-line}
#timer{font-size:26px;color:var(--timer)}
.tip-box{font-size:11px;font-weight:normal;font-style:italic;margin-top:4px;text-align:left}
.hint{font-size:10px;opacity:.65;margin-top:8px;text-align:center;font-weight:normal}
</style>
</head>
<body>
<div class="toy">
  <div class="chain" id="chain"></div>
  <div class="ring"></div>
  <div class="tab"></div>
  <div class="egg" id="egg">
    <div class="logo" id="logo">Pixell</div>
    <div class="burstw">
      <div class="burst" id="burst"></div>
      <div class="screen">
        <div class="tiles" id="tiles"></div>
        <canvas id="pet" width="130" height="80"></canvas>
        <div class="meters">
          <div class="m"><span class="ico" data-ic="eye"></span><div class="seg" id="s-up"></div></div>
          <div class="m"><span class="ico" data-ic="hand"></span><div class="seg" id="s-low"></div></div>
        </div>
      </div>
    </div>
    <button class="b" id="bA" aria-label="Выбрать (A)">A</button>
    <button class="b" id="bB" aria-label="Начать (B)">B</button>
    <button class="b" id="bC" aria-label="Отмена (C)">C</button>
  </div>
</div>
<div class="cap">
  <div id="game-ui"><div id="status-text"></div><div class="hint" id="tag"></div></div>
  <div id="exercise-ui">
    <p id="instruction-text"></p>
    <div id="timer">01:00</div>
    <div class="tip-box" id="tip-text"></div>
  </div>
</div>
<script>
const $=id=>document.getElementById(id);
/* ---- декор: брелок, леденцовая посыпка, зубчатая рамка, буквы логотипа ---- */
for(let i=0;i<6;i++){const b=document.createElement('i');b.className='bead';b.style.top=(i*11)+'px';b.style.left='calc(50% + '+(i%2?-4:5)+'px - 6px)';$('chain').appendChild(b)}
let seed=11;const rnd=()=>(seed=(seed*16807)%2147483647)/2147483647;
const cols=['#e8453c','#f5a623','#f6e05e','#2bb5a0','#ffffff','#ec4899','#7bd5c8'];let n=0;
for(let i=0;i<200&&n<44;i++){
  const x=rnd()*96,y=rnd()*96;
  if(x>9&&x<89&&y>17&&y<85)continue;
  if(x>14&&x<84&&y>6&&y<19)continue;
  const s=document.createElement('i');s.className='sp';
  s.style.cssText='left:'+x+'%;top:'+y+'%;background:'+cols[Math.floor(rnd()*cols.length)]+';transform:rotate('+Math.floor(rnd()*180)+'deg)';
  $('egg').appendChild(s);n++;
}
(function(){const pts=[];for(let i=0;i<40;i++){const a=i*Math.PI/20,c=Math.cos(a),s=Math.sin(a),r=(i%2?45:50)/Math.pow(Math.pow(Math.abs(c),4)+Math.pow(Math.abs(s),4),.25);
 pts.push((50+r*c).toFixed(1)+'% '+(50+r*s).toFixed(1)+'%')}$('burst').style.clipPath='polygon('+pts.join(',')+')'})();
$('logo').innerHTML=[...'Pixell'].map((ch,i)=>'<span style="transform:rotate('+[-6,4,-3,5,-4,3][i]+'deg) translateY('+[0,3,-2,2,-3,1][i]+'px)">'+ch+'</span>').join('');

/* ---- игра ---- */
let upperStat=100,lowerStat=100,lockControls=false,breakTimer=null,breaks=0,sel=0,petMood='happy',frame=0,blink=0,celebrate=0;
try{breaks=+localStorage.getItem('pixell-breaks')||0}catch(e){}
const ICONS={
 eye:["..#####..",".#.....#.","#..###..#","#..###..#","#..###..#",".#.....#.","..#####.."],
 head:["..#####..",".#.....#.",".#.#.#.#.",".#.....#.",".#.###.#.","..#####..","....#....",".#######.","#########"],
 hand:["...#.#...","...#.#.#.",".#.#.#.#.",".#.#.#.#.",".#######.","#########",".#######.","..#####.."],
 lungs:["....#....","....#....","..#.#.#..",".##.#.##.","###.#.###","###...###","###...###",".##...##."],
 bulb:["..###..",".#...#.","#.....#","#.....#",".#...#.","..###..","..###..","..###..","...#..."]
};
function icon(n){const r=ICONS[n];let d='';r.forEach((row,y)=>[...row].forEach((c,x)=>{if(c==='#')d+='M'+x+' '+y+'h1v1h-1z'}));return '<svg class="px" viewBox="0 0 '+r[0].length+' '+r.length+'" shape-rendering="crispEdges" aria-hidden="true"><path d="'+d+'"/></svg>'}
const icons=['eye','head','hand','lungs'];
const types=['eyes','head','hands','breath'],icons0=['👁️','🧠','✍️','🫁'],names=['ГЛАЗА','ШЕЯ И ГОЛОВА','КИСТИ','ДЫХАНИЕ'];
const tips=[
 "💡 Правило 20-20-20: каждые 20 минут смотрите на 20 метров вдаль 20 секунд.",
 "💡 Пейте воду мелкими глотками при стрессе: мозг переключается, тревога снижается.",
 "💡 Жевание жвачки может снижать уровень кортизола — гормона стресса.",
 "💡 Цитрус на столе бодрит: запах лимона или апельсина работает не хуже кофе.",
 "💡 10 минут тишины без гаджетов помогают нервной системе перезагрузиться.",
 "💡 Каждые 45–60 минут вставайте и пройдитесь хотя бы минуту: кровь разгоняется, голова проясняется.",
 "💡 Держите экран на расстоянии вытянутой руки, а верх экрана — на уровне глаз или чуть ниже.",
 "💡 Моргайте осознанно: за экраном мы моргаем вдвое реже, и глаза пересыхают.",
 "💡 Метод «помидора»: выпишите одну задачу, работайте над ней 25 минут, затем отдохните 5.",
 "💡 Прохладная вода на лицо и запястья быстро прогоняет сонливость.",
 "💡 Яркость экрана должна быть близка к яркости комнаты — так глаза устают меньше.",
 "💡 Стопы лучше держать на полу, а колени согнутыми примерно под прямым углом.",
 "💡 Короткий взгляд на зелень за окном или комнатное растение помогает глазам расслабиться.",
 "💡 Вечером включайте тёплый режим экрана: меньше синего света — легче заснуть.",
 "💡 Усталость часто путают с жаждой: стакан воды порой бодрит не хуже кофе.",
 "💡 Перед сложной задачей запишите, что именно нужно сделать за ближайшие 10 минут. Начать станет легче."
];
const EX={
 eyes:{stat:'u',steps:["МОРГАЙ БЫСТРО 10 РАЗ, ПОТОМ ЗАКРОЙ ГЛАЗА","ПОСМОТРИ ВДАЛЬ, В ОКНО ИЛИ НА ГОРИЗОНТ","ВРАЩАЙ ГЛАЗАМИ ПО КРУГУ, МЕДЛЕННО","ПОТРИ ЛАДОШКИ И ПРИЛОЖИ К ЗАКРЫТЫМ ГЛАЗАМ"]},
 head:{stat:'u',steps:["НАКЛОНИ ГОЛОВУ К ПЛЕЧУ, 10 СЕК. В КАЖДУЮ СТОРОНУ","МЕДЛЕННО КИВАЙ: ВВЕРХ-ВНИЗ","ПОДНИМИ ПЛЕЧИ К УШАМ И РЕЗКО ОПУСТИ","ПЛАВНО ПОВЕРНИ ГОЛОВУ ВЛЕВО И ВПРАВО"]},
 hands:{stat:'l',steps:["СЖИМАЙ И РАЗЖИМАЙ КУЛАКИ","ВРАЩАЙ КИСТЯМИ В ОБЕ СТОРОНЫ","РАСПРАВЬ ПАЛЬЦЫ ШИРОКО И ВЕРНИ ОБРАТНО","ПОТЯНИ ПАЛЬЦЫ ДРУГОЙ РУКОЙ НАЗАД"]},
 breath:{stat:'l',steps:["ВДОХ НОСОМ НА 4 СЧЁТА","ЗАДЕРЖИ ДЫХАНИЕ НА 4 СЧЁТА","ВЫДОХ РТОМ НА 6 СЧЁТОВ","ПОВТОРЯЙ СПОКОЙНО, ПЛЕЧИ РАССЛАБЬ"]}
};
const SECONDS=60;
const MORE={
 eyes:[
  {n:"Восьмёрка",s:["ПРЕДСТАВЬ БОЛЬШУЮ ВОСЬМЁРКУ НА СТЕНЕ","ВОДИ ГЛАЗАМИ ПО НЕЙ, ГОЛОВА НЕПОДВИЖНА","ТЕПЕРЬ В ОБРАТНУЮ СТОРОНУ","ЗАКРОЙ ГЛАЗА И РАССЛАБЬ ВЕКИ"]},
  {n:"Фокус пальца",s:["ВЫТЯНИ РУКУ, ПАЛЕЦ НА УРОВНЕ ГЛАЗ","СМОТРИ НА КОНЧИК ПАЛЬЦА, ПРИБЛИЖАЙ К НОСУ","ПЕРЕВЕДИ ВЗГЛЯД НА ПРЕДМЕТ ВДАЛИ","ПОВТОРЯЙ: БЛИЗКО — ДАЛЕКО"]},
  {n:"Пальминг",s:["ПОТРИ ЛАДОНИ, ЧТОБЫ СОГРЕТЬ ИХ","ЗАКРОЙ ГЛАЗА И ПРИЛОЖИ ТЁПЛЫЕ ЛАДОНИ","НЕ НАДАВЛИВАЙ, ПРОСТО ПОСИДИ В ТЕМНОТЕ","ОТКРОЙ ГЛАЗА МЕДЛЕННО, ПОМОРГАЙ"]}],
 head:[
  {n:"Плечи-колёса",s:["КРУГИ ПЛЕЧАМИ НАЗАД, 10 РАЗ","КРУГИ ПЛЕЧАМИ ВПЕРЁД, 10 РАЗ","СОЕДИНИ ЛОПАТКИ И ЗАДЕРЖИСЬ НА 5 СЕК.","РАССЛАБЬ ПЛЕЧИ И ВСТРЯХНИ РУКАМИ"]},
  {n:"Подбородок",s:["МЯГКО ПРИЖМИ ПОДБОРОДОК К ГРУДИ","МЕДЛЕННО ВЕРНИ ГОЛОВУ НА МЕСТО","ПОДТЯНИ ПОДБОРОДОК НАЗАД, БУДТО ДЕЛАЕШЬ ДВОЙНОЙ","ПОВТОРИ И ДЫШИ РОВНО"]},
  {n:"Потянись",s:["СЦЕПИ ПАЛЬЦЫ В ЗАМОК И ПОДНИМИ РУКИ ВВЕРХ","ВЫТЯНИСЬ, ВСТАНЬ НА НОСКИ","ПОВЕРНИ КОРПУС ВЛЕВО, ПОТОМ ВПРАВО","ОПУСТИ РУКИ И ВСТРЯХНИ ПЛЕЧИ"]}],
 hands:[
  {n:"Замок",s:["СЦЕПИ ПАЛЬЦЫ И ВЫВЕРНИ ЛАДОНИ ОТ СЕБЯ","ВЫТЯНИ РУКИ ВПЕРЁД, ПОТЯНИСЬ","ЗАВЕДИ РУКИ ЗА СПИНУ И РАЗВЕДИ ЛОКТИ","ВСТРЯХНИ КИСТИ, КАК ПОСЛЕ МЫТЬЯ РУК"]},
  {n:"Пианист",s:["ПОСТУЧИ КОНЧИКАМИ ПАЛЬЦЕВ ПО СТОЛУ","ПОДНИМАЙ КАЖДЫЙ ПАЛЕЦ ПО ОЧЕРЕДИ","КАСАЙСЯ БОЛЬШИМ ПАЛЬЦЕМ КАЖДОГО ПАЛЬЦА","ПОТРИ ЛАДОНИ И ПРЕДПЛЕЧЬЯ"]},
  {n:"Массаж",s:["БОЛЬШИМ ПАЛЬЦЕМ МАССИРУЙ ЛАДОНЬ КРУГАМИ","ПОМАССИРУЙ КАЖДЫЙ ПАЛЕЦ ОТ ОСНОВАНИЯ","СМЕНИ РУКУ И ПОВТОРИ","ПОТЯНИ ЗАПЯСТЬЕ ВВЕРХ И ВНИЗ ЛАДОНЬЮ"]}],
 breath:[
  {n:"Квадрат",s:["ВДОХ НА 4 СЧЁТА","ЗАДЕРЖКА НА 4 СЧЁТА","ВЫДОХ НА 4 СЧЁТА","ПАУЗА НА 4 СЧЁТА, ПОВТОРЯЙ"]},
  {n:"Дыхание животом",s:["ПОЛОЖИ РУКУ НА ЖИВОТ","ВДОХНИ НОСОМ, ЧТОБЫ ЖИВОТ ПОДНЯЛСЯ","ВЫДОХНИ МЕДЛЕННО, ЖИВОТ ОПАДАЕТ","ПЛЕЧИ НЕПОДВИЖНЫ, ДЫШИ СПОКОЙНО"]},
  {n:"Пять чувств",s:["НАЗОВИ 5 ПРЕДМЕТОВ, КОТОРЫЕ ВИДИШЬ","НАЗОВИ 4 ЗВУКА, КОТОРЫЕ СЛЫШИШЬ","ПОЧУВСТВУЙ 3 ПРИКОСНОВЕНИЯ: ОДЕЖДА, СТУЛ, ПОЛ","СДЕЛАЙ МЕДЛЕННЫЙ ВДОХ И ВЫДОХ"]}]
};
const BASE_N={eyes:"Моргание и даль",head:"Разминка шеи",hands:"Разминка кистей",breath:"Дыхание 4-4-6"};
for(const k in MORE)EX[k].alt=[{n:BASE_N[k],s:EX[k].steps}].concat(MORE[k]);
function renderTiles(){
  $('tiles').innerHTML=icons.map((ic,i)=>'<button class="tile'+(i===sel?' sel':'')+'" data-i="'+i+'" aria-label="'+names[i]+'">'+icon(ic)+'</button>').join('');
  $('tiles').querySelectorAll('.tile').forEach(t=>t.onclick=()=>{const i=+t.dataset.i;if(sel===i)runBreak(types[i]);else{sel=i;renderTiles();updateTag()}});
}
function updateTag(){$('tag').innerText='ВЫБРАНО: '+names[sel]+' · УР.'+(1+Math.floor(breaks/3))+' · ПАУЗ: '+breaks+' · A — выбор, B — старт, C — отмена'}
function seg(id,v){const k=Math.ceil(v/10);$(id).innerHTML='<i class="on"></i>'.repeat(k)+'<i></i>'.repeat(10-k)}
function renderScreen(){seg('s-up',upperStat);seg('s-low',lowerStat)}
setInterval(()=>{if(lockControls)return;upperStat=Math.max(0,upperStat-1);lowerStat=Math.max(0,lowerStat-.8);renderScreen();evaluateMood()},6000);
function evaluateMood(){
  const t=$('status-text');
  if(upperStat<=0&&lowerStat<=0){petMood='burnout';t.innerText="Полное выгорание! Мне нужна минута отдыха!"}
  else if(upperStat<40){petMood='tired';t.innerText="Экран оглушил мой мозг. Выбери глаза или шею!"}
  else if(lowerStat<40){petMood='droopy';t.innerText="Мои пиксели затекли. Давай разомнём кисти и подышим!"}
  else{petMood=Math.min(upperStat,lowerStat)>=70?'happy':'normal';t.innerText="Я в порядке! Учись, но не забывай делать паузы."}
}
function setBusy(on){$('bA').disabled=on;$('bB').disabled=on;document.querySelectorAll('.tile').forEach(t=>t.disabled=on)}
function fmt(s){return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')}
function runBreak(type){
  if(lockControls)return;
  lockControls=true;setBusy(true);petMood='exercise';
  const base=EX[type],v=base.alt[Math.floor(Math.random()*base.alt.length)],ex={stat:base.stat,steps:v.s,n:v.n};let left=SECONDS;
  $('game-ui').style.display='none';$('exercise-ui').style.display='block';
  $('tip-text').innerHTML=icon('bulb')+tips[Math.floor(Math.random()*tips.length)].replace('💡 ','');
  $('timer').innerText=fmt(left);$('instruction-text').innerText='«'+ex.n+'»\n'+ex.steps[0];
  breakTimer=setInterval(()=>{
    left--;$('timer').innerText=fmt(left);
    $('instruction-text').innerText='«'+ex.n+'»\n'+ex.steps[Math.min(ex.steps.length-1,Math.floor((SECONDS-left)/(SECONDS/ex.steps.length)))];
    if(left<=0){clearInterval(breakTimer);endBreak(ex)}
  },1000);
}
function endBreak(ex){
  lockControls=false;setBusy(false);
  $('exercise-ui').style.display='none';$('game-ui').style.display='block';
  if(ex){
    if(ex.stat==='u')upperStat=Math.min(100,upperStat+45);else lowerStat=Math.min(100,lowerStat+45);
    breaks++;try{localStorage.setItem('pixell-breaks',breaks)}catch(e){}
    renderScreen();evaluateMood();updateTag();
    $('status-text').innerText="Ура! Стало легче. Спасибо за паузу!";celebrate=10;
  }else{evaluateMood();updateTag();$('status-text').innerText="Пауза прервана. Я подожду."}
}
$('bA').onclick=()=>{if(!lockControls){sel=(sel+1)%4;renderTiles();updateTag()}};
$('bB').onclick=()=>runBreak(types[sel]);
$('bC').onclick=()=>{if(lockControls){clearInterval(breakTimer);endBreak(null)}else{$('status-text').innerText="C отменяет упражнение, а сейчас отменять нечего. Выбери иконку кнопкой A и нажми B."}};

/* ---- сцена и спрайт: сетка 26x16, клетка 5px ---- */
const BODY=["..##........##..","..###......###..","..############..",".##############.",".##############.",".##############.",".##############.",".######oo######.",".#####oooo#####.",".#####oooo#####.","..############..","..###......###..","..##........##.."];
const pc=$('pet').getContext('2d'),MINT='#bfe3dc',PINK='#f6cfc9',INK='#1e1c17',FILL='#fffbea',BELLY='#f7d9d9',DEAD='#cfcdc8',RED='#e8453c',BLUSH='#f29a9a',DROP='#5bb5d6',OX=5,OY=0;
function Q(x,y,c){pc.fillStyle=c;pc.fillRect(x*5,y*5,5,5)}
function P(x,y,c){Q(x+OX,y+OY,c)}
function drawScene(){
  for(let x=0;x<26;x++)for(let y=0;y<16;y++){Q(x,y,(Math.abs(x%8-3.5)+Math.abs(y%8-3.5)<4)?MINT:PINK)}
  for(let x=7;x<=18;x++)Q(x,15,'#e3a9a9');for(let x=8;x<=17;x++)Q(x,14,'#e3a9a9');
}
function solid(r,c){return r>=0&&r<BODY.length&&c>=0&&c<16&&BODY[r][c]!=='.'}
function drawPet(){
  drawScene();
  const m=celebrate>0?'happy':petMood,f=frame%2;
  const o=(m==='tired'||m==='burnout')?1:1+f,e=o+3,my=o+5;
  BODY.forEach((row,y)=>[...row].forEach((ch,x)=>{
    if(ch==='.')return;
    const edge=!solid(y-1,x)||!solid(y+1,x)||!solid(y,x-1)||!solid(y,x+1);
    P(x,y+o,edge?INK:(m==='burnout'?DEAD:(ch==='o'?BELLY:FILL)));
  }));
  [5,10].forEach(cx=>{
    if(m==='happy'){P(cx-1,e+1,INK);P(cx,e,INK);P(cx+1,e+1,INK)}
    else if(m==='burnout'){P(cx-1,e,INK);P(cx+1,e,INK);P(cx,e+1,INK);P(cx-1,e+2,INK);P(cx+1,e+2,INK)}
    else if(m==='tired'||m==='exercise'||blink){P(cx-1,e+1,INK);P(cx,e+1,INK);P(cx+1,e+1,INK)}
    else if(m==='droopy'){P(cx,e+1,INK);P(cx,e+2,INK)}
    else{P(cx,e,INK);P(cx,e+1,INK)}
  });
  if(m==='happy'){P(6,my-1,INK);P(9,my-1,INK);[6,7,8,9].forEach(x=>P(x,my,INK));P(2,my-1,BLUSH);P(13,my-1,BLUSH);P(-1,2+f*2,RED);P(16,4-f*2,RED)}
  else if(m==='droopy'){P(7,my,INK);P(8,my,INK);P(6,my+1,INK);P(9,my+1,INK)}
  else if(m==='burnout'){[6,7,8,9].forEach(x=>P(x,my,INK));P(8,my+1,RED);P(9,my+1,RED)}
  else if(m==='exercise'){[7,8].forEach(x=>{P(x,my,INK);P(x,my+1,INK)});P(-1,o+6-f*3,INK);P(16,o+6-f*3,INK)}
  else{P(7,my,INK);P(8,my,INK)}
  if(m==='tired'){P(15,o+2+f,DROP);P(15,o+3+f,DROP)}
}
setInterval(()=>{frame++;blink=Math.random()<.15?1:0;if(celebrate>0)celebrate--;drawPet()},450);
document.querySelectorAll('[data-ic]').forEach(e=>e.innerHTML=icon(e.dataset.ic));
renderTiles();updateTag();renderScreen();evaluateMood();drawPet();
</script>
</body>
</html>
